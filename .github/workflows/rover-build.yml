name: Rover build

on:
  push:
    branches: ['rover']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmu-v4-rover:
    name: px4_fmu-v4_rover
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev:v1.17.0-rc2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build firmware
        run: make px4_fmu-v4_rover
      - name: Firmware size
        run: arm-none-eabi-size build/px4_fmu-v4_rover/px4_fmu-v4_rover.elf
      - uses: actions/upload-artifact@v4
        with:
          name: px4_fmu-v4_rover
          path: build/px4_fmu-v4_rover/px4_fmu-v4_rover.px4

  fmu-v3-rover:
    name: px4_fmu-v3_rover
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev:v1.17.0-rc2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build firmware
        run: make px4_fmu-v3_rover
      - name: Firmware size
        run: arm-none-eabi-size build/px4_fmu-v3_rover/px4_fmu-v3_rover.elf
      - uses: actions/upload-artifact@v4
        with:
          name: px4_fmu-v3_rover
          path: build/px4_fmu-v3_rover/px4_fmu-v3_rover.px4

  sitl:
    name: px4_sitl
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev:v1.17.0-rc2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build SITL
        run: make px4_sitl_default

  release:
    name: Release v1.17.0-N
    needs: [fmu-v4-rover, fmu-v3-rover]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # serialize so two quick pushes cannot pick the same number
    concurrency:
      group: rover-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: px4_fmu-v4_rover
      - uses: actions/download-artifact@v4
        with:
          name: px4_fmu-v3_rover
      - name: Next release number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api --paginate "repos/${{ github.repository }}/git/matching-refs/tags/v1.17.0-" \
            --jq '.[].ref | sub("refs/tags/v1.17.0-"; "")' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "tag=v1.17.0-$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            px4_fmu-v4_rover.px4
            px4_fmu-v3_rover.px4
